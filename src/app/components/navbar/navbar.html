<nav class="nav-wrap">

  <!-- MUI TOOLBAR -->
  <mat-toolbar class="nav-bar">

    <!-- LOGO -->
    <div class="nav-left">

      <button
        mat-button
        class="logo-btn"
        (click)="scrollTo('hero')">

        <h2 class="logo">
          Medha
        </h2>

      </button>

    </div>

    <!-- NAV ITEMS -->
    <div class="nav-center" [class.open]="menuOpen">

      <button
        mat-button
        (click)="scrollTo('hero')"
        [class.active]="activeSection === 'hero'">
        Home
      </button>

      <button
        mat-button
        (click)="scrollTo('impact')"
        [class.active]="activeSection === 'impact'">
        About
      </button>

      <button
        mat-button
        (click)="scrollTo('skills')"
        [class.active]="activeSection === 'skills'">
        Skills
      </button>

      <button
        mat-button
        (click)="scrollTo('projects')"
        [class.active]="activeSection === 'projects'">
        Projects
      </button>

      <button
        mat-button
        (click)="scrollTo('contact')"
        [class.active]="activeSection === 'contact'">
        Contact
      </button>

    </div>

    <!-- RIGHT -->
    <div class="nav-right">

      <!-- THEME TOGGLE -->
      <button
        mat-icon-button
        type="button"
        class="theme-toggle"
        (click)="theme.toggleTheme()"
        aria-live="polite"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">

        <span class="sr-only">
          {{ theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode' }}
        </span>

        <div class="icon">
          <div class="sun"></div>
          <div class="moon"></div>
        </div>

      </button>

      <!-- MOBILE MENU -->
      <button
        mat-icon-button
        class="menu-icon"
        (click)="toggleMenu()">

        <mat-icon>
          {{ menuOpen ? 'close' : 'menu' }}
        </mat-icon>

      </button>

    </div>

  </mat-toolbar>

</nav>

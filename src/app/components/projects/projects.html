<div class="projects">

  <div class="projects-wrapper">

    <!-- ================= SECTION HEADER ================= -->
    <div class="section-header">
      <h2>My Work</h2>
      <p>Not just projects — systems designed to solve real problems</p>
    </div>

    <!-- ================= PROJECT GRID ================= -->
    <div class="projects-grid">

      @for (p of projects; track p.name) {

        <mat-card
          class="project-card"
          [ngClass]="p.color"
        >

          <!-- TOP -->
          <div class="card-top">

            <h3>{{ p.name }}</h3>

            <span class="highlights">
              {{ p.highlights }}
            </span>

          </div>

          <!-- DESC -->
          <p class="desc">
            {{ p.desc }}
          </p>

          <!-- ROLE -->
          <div class="role">
            <strong>My Role:</strong>
            {{ p.role }}
          </div>

          <!-- TECH STACK -->
          <div class="tech">

            @for (t of p.tech; track t) {
              <span>{{ t }}</span>
            }

          </div>

          <!-- FOOTER -->
          <div class="card-footer">

            <button
              mat-raised-button
              class="view-btn"
              (click)="openProject(p.github)"
            >
              View Details →
            </button>

          </div>

        </mat-card>

      }

    </div>

  </div>

</div>

<div class="container">

  <div class="section-header mat-elevation-z1">
    <h2>My Work</h2>
    <p>Not just projects — systems designed to solve real problems</p>
  </div>

  <div class="projects-grid">

    @for (p of projects; track p.name) {
      <div 
        class="project-card" 
        [ngClass]="p.color"
      >

        <div class="card-top">
          <h3>{{ p.name }}</h3>
          <span class="highlights">{{ p.highlights }}</span>
        </div>

        <p class="desc">{{ p.desc }}</p>

        <div class="role">
          <strong>My Role:</strong> {{ p.role }}
        </div>

        <div class="tech">
          @for (t of p.tech; track t) {
            <span>{{ t }}</span>
          }
        </div>

        <div class="card-footer">
          <button 
            mat-raised-button 
            color="primary" 
            class="view-btn"
            (click)="openProject(p.github)"
          >
            View Details →
          </button>
        </div>

      </div>
    }

  </div>
</div>

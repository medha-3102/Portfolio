<div class="container">

  <div class="section-header">
    <h2>What I Bring</h2>
    <p>Not just skills — capabilities to build real systems</p>
  </div>

  <div class="skills-grid">

    @for (group of skillGroups; track group.title) {
      <div 
        class="skill-card" 
        [ngClass]="group.color"
      >

        <h3>{{ group.title }}</h3>
        <p class="desc">{{ group.desc }}</p>

        <div class="skill-tags">
          @for (s of group.skills; track s) {
            <span>{{ s }}</span>
          }
        </div>

      </div>
    }

  </div>
</div>

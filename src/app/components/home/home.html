<div class="home">

  <div class="home-wrap">

    <!-- ONLY changed div -> mat-card -->
    <mat-card class="home-card">

      <div class="home-grid">

        <!-- LEFT CONTENT -->
        <div class="content">

          <p class="intro">Hi, I’m</p>

          <h1 class="name">
            <span #typingText></span>
            <span class="cursor">|</span>
          </h1>

          <!-- ONLY changed div -> mat-chip -->
          <mat-chip class="role-chip">
            Product-minded Developer • Angular • Spring Boot
          </mat-chip>

          <h2 class="tagline">
            I build systems that make complexity feel simple.
          </h2>

          <div class="divider"></div>

          <p class="desc">
            From dashboards to scalable applications, I transform ideas into
            structured, intuitive, and impactful digital products.
          </p>

          <div class="buttons">

            <!-- ONLY changed button -> mat button -->
            <button
              mat-flat-button
              color="primary"
              (click)="scrollToProjects()">
              View My Work
            </button>

            <button
              mat-stroked-button
              class="outline"
              (click)="downloadResume()">
              Download Resume
            </button>

          </div>

        </div>

        <!-- RIGHT VISUAL -->
        <div class="visual">

          <div class="profile-card">

            <!-- BIG IMAGE -->
            <div class="image-wrapper">
              <img src="mepng.png" alt="Medha" />
            </div>

            <!-- LOCATION -->
            <p class="location">
              <mat-icon>location_on</mat-icon>
              Bareilly, UP, India
            </p>

            <!-- EMAIL -->
            <a href="mailto:medhagupta312002@gmail.com" class="email">
              <mat-icon>mail</mat-icon>
              medhagupta312002@gmail.com
            </a>

            <!-- SOCIALS -->
            <div class="socials">

              <a
                href="https://github.com/medha-3102/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub">

                <button mat-mini-fab>
                  <i class="fa-brands fa-github"></i>
                </button>

              </a>

              <a
                href="https://www.linkedin.com/in/medha-gupta-5b6838185/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn">

                <button mat-mini-fab color="primary">
                  <i class="fa-brands fa-linkedin-in"></i>
                </button>

              </a>

            </div>

          </div>

        </div>

      </div>

    </mat-card>

  </div>

</div>
